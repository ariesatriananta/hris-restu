packages:
  - apps/*

# pnpm 11 memblokir lifecycle script dependency secara default. Izinkan hanya
# package dan versi native/build yang sudah ditinjau dalam lockfile ini.
allowBuilds:
  'argon2@0.44.0': true
  # Postinstall esbuild mencoba menjalankan binary sebelum permission Hostinger
  # diperbaiki. Build script menyiapkannya secara eksplisit setelah install.
  'esbuild@0.18.20 || 0.25.11 || 0.28.1': false
